[workspace]
resolver = "2"
members = [
    "crates/qasa-api",
    "crates/qasa-core",
    "crates/qasa-db",
    "crates/qasa-payments",
    "crates/qasa-breach",
    "crates/qasa-vpn",
    "crates/qasa-worker",
    "crates/qasa-push",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
jsonwebtoken = "9"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }

qasa-core = { path = "crates/qasa-core" }
qasa-db = { path = "crates/qasa-db" }
qasa-payments = { path = "crates/qasa-payments" }
qasa-breach = { path = "crates/qasa-breach" }
qasa-vpn = { path = "crates/qasa-vpn" }
qasa-worker = { path = "crates/qasa-worker" }
qasa-push = { path = "crates/qasa-push" }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
