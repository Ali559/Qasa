services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qasa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: qasa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qasa -d qasa"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [qasa]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      QASA_PUBLIC_HOST: ${QASA_PUBLIC_HOST:-api.qasa.app}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks: [qasa]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: qasa-api
    environment:
      QASA_ENV: prod
      DATABASE_URL: postgres://qasa:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/qasa
      BIND_ADDR: 0.0.0.0:8080
      QASA_ADMIN_JWT_SECRET: ${QASA_ADMIN_JWT_SECRET:?set QASA_ADMIN_JWT_SECRET}
      QASA_LICENSE_PRIVATE_KEY: ${QASA_LICENSE_PRIVATE_KEY:?set QASA_LICENSE_PRIVATE_KEY}
      QASA_ADMIN_CORS_ORIGIN: ${QASA_ADMIN_CORS_ORIGIN:-https://admin.qasa.app}
      # Restrict /v1/admin/* to the VPN range. Strongly recommended: without it the
      # admin surface is reachable by anyone who can reach this port.
      QASA_ADMIN_ALLOW_CIDRS: ${QASA_ADMIN_ALLOW_CIDRS:-tailscale}
      # Caddy is the only thing that can reach the API (it publishes no port), and it
      # lives on this fixed network, so its X-Forwarded-For is the real client address.
      QASA_TRUSTED_PROXY_CIDRS: ${QASA_TRUSTED_PROXY_CIDRS:-172.30.0.0/24}
      # Device push. Without these, inbox rows still write and pushes are logged only.
      QASA_FCM_PROJECT_ID: ${QASA_FCM_PROJECT_ID:-}
      QASA_FCM_SERVICE_ACCOUNT_JSON: ${QASA_FCM_SERVICE_ACCOUNT_JSON:-}
      QASA_FCM_SERVICE_ACCOUNT_JSON_INLINE: ${QASA_FCM_SERVICE_ACCOUNT_JSON_INLINE:-}
      # Wayl checkout and renewal links. Off until QASA_WAYL_API_KEY is set; webhooks go to
      # https://$QASA_PUBLIC_HOST/v1/payments/webhook/wayl.
      QASA_WAYL_API_KEY: ${QASA_WAYL_API_KEY:-}
      QASA_WAYL_WEBHOOK_SECRET: ${QASA_WAYL_WEBHOOK_SECRET:-}
      QASA_WAYL_REDIRECT_URL: ${QASA_WAYL_REDIRECT_URL:-}
      QASA_PUBLIC_HOST: ${QASA_PUBLIC_HOST:-api.qasa.app}
      RUST_LOG: qasa_api=info,tower_http=info,sqlx=warn
    # No published port: all traffic comes through Caddy (TLS) on the internal network.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [qasa]

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: qasa-worker
    environment:
      QASA_ENV: prod
      DATABASE_URL: postgres://qasa:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/qasa
      # The worker builds AppConfig too, and AppConfig panics in prod without this.
      QASA_ADMIN_JWT_SECRET: ${QASA_ADMIN_JWT_SECRET:?set QASA_ADMIN_JWT_SECRET}
      QASA_LICENSE_PRIVATE_KEY: ${QASA_LICENSE_PRIVATE_KEY:?set QASA_LICENSE_PRIVATE_KEY}
      # The worker is gated off outside prod; in prod it is the point of the service.
      QASA_WORKER_ENABLE: ${QASA_WORKER_ENABLE:-1}
      QASA_FCM_PROJECT_ID: ${QASA_FCM_PROJECT_ID:-}
      QASA_FCM_SERVICE_ACCOUNT_JSON: ${QASA_FCM_SERVICE_ACCOUNT_JSON:-}
      QASA_FCM_SERVICE_ACCOUNT_JSON_INLINE: ${QASA_FCM_SERVICE_ACCOUNT_JSON_INLINE:-}
      # The worker creates renewal links and checks open payments with the same settings.
      QASA_WAYL_API_KEY: ${QASA_WAYL_API_KEY:-}
      QASA_WAYL_WEBHOOK_SECRET: ${QASA_WAYL_WEBHOOK_SECRET:-}
      QASA_WAYL_REDIRECT_URL: ${QASA_WAYL_REDIRECT_URL:-}
      QASA_PUBLIC_HOST: ${QASA_PUBLIC_HOST:-api.qasa.app}
      RUST_LOG: qasa_worker=info,sqlx=warn
    depends_on:
      postgres:
        condition: service_healthy
    networks: [qasa]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  qasa:
    ipam:
      config:
        - subnet: 172.30.0.0/24
