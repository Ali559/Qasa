[package]
name = "qasa-ffi"
version = "0.1.0"
description = "UniFFI bindings of the Qasa core for the iOS and Android apps: Wi-Fi sync and payload conversion."
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "qasa_ffi"

[[bin]]
# Generates the Swift and Kotlin bindings:
#   cargo run -p qasa-ffi --bin uniffi-bindgen -- generate --library <built lib> --language swift --out-dir <dir>
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
qasa-sync = { path = "../qasa-sync" }
qasa-vault = { path = "../qasa-vault" }
thiserror = "2"
uniffi = { version = "0.28", features = ["cli"] }

[dev-dependencies]
mdns-sd = "0.13"
uuid = { version = "1", features = ["v4"] }
