[package]
name = "qasa-biometric"
version = "0.1.0"
description = "Seals a vault secret behind Touch ID (Secure Enclave) or Windows Hello."
edition = "2021"
rust-version = "1.82"
license-file = "../../../LICENSE.md"
publish = false

# Its own workspace, so the Windows code can be checked on its own:
#   cargo check --target x86_64-pc-windows-msvc
[workspace]

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
p256 = { version = "0.13", features = ["ecdh"] }

[build-dependencies]
swift-rs = { version = "1.0", features = ["build"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
] }

[dev-dependencies]
serde_json = "1"
