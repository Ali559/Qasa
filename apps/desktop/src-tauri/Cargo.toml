[package]
name = "qasa-desktop"
version = "0.1.0"
description = "Qasa for macOS, Windows and Linux"
edition = "2021"
rust-version = "1.82"
license-file = "../../../LICENSE.md"
publish = false

# Its own workspace: the desktop builds apart from server/ and core/.
[workspace]

[lib]
name = "qasa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
qasa-vault = { path = "../../../core/qasa-vault" }
rqrr = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["isolation"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
