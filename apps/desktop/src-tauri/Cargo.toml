[package]
name = "qasa-desktop"
version = "0.1.0"
description = "Qasa for macOS, Windows and Linux"
edition = "2021"
rust-version = "1.82"
license-file = "../../../LICENSE.md"
publish = false

# Its own workspace: the desktop builds apart from server/ and core/.
[workspace]

[lib]
name = "qasa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha1 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
qasa-biometric = { path = "../biometric" }
qasa-vault = { path = "../../../core/qasa-vault" }
qasa-sync = { path = "../../../core/qasa-sync" }
mdns-sd = "0.13"
rqrr = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["isolation"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
whoami = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
