<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>One-time code</title><link rel="stylesheet" href="style.css"><script src="common.js"></script></head>
<body>
<h1>Enter the code from your authenticator</h1>
<form id="otp" data-record>
  <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
  <button type="submit">Verify</button>
</form>
<pre id="result"></pre>
</body>
</html>
