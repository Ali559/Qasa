<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Change password</title><link rel="stylesheet" href="style.css"><script src="common.js"></script></head>
<body>
<h1>Change password</h1>
<form id="change" data-record>
  <input type="hidden" name="username" autocomplete="username" value="alice@127">
  <input id="current" name="current" type="password" autocomplete="current-password" placeholder="Current password">
  <input id="new" name="new" type="password" autocomplete="new-password" placeholder="New password">
  <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Repeat new password">
  <button type="submit">Change password</button>
</form>
<pre id="result"></pre>
</body>
</html>
