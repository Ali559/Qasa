<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Shadow DOM</title><link rel="stylesheet" href="style.css"><script src="common.js"></script></head>
<body>
<h1>Login in a shadow root</h1>
<login-box></login-box>
<script>
  customElements.define("login-box", class extends HTMLElement {
    connectedCallback() {
      const root = this.attachShadow({ mode: "open" })
      root.innerHTML = `<style>input{display:block;height:44px;width:320px;margin:8px 0;font:inherit}</style>
        <form id="login"><input id="username" name="email" type="email" autocomplete="username">
        <input id="password" name="password" type="password" autocomplete="current-password">
        <button type="submit">Sign in</button></form>`
      root.querySelector("form").addEventListener("submit", (e) => {
        e.preventDefault()
        document.getElementById("result").textContent = JSON.stringify({ email: root.getElementById("username").value, password: root.getElementById("password").value })
      })
    }
  })
</script>
<pre id="result"></pre>
</body>
</html>
