<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign up</title><link rel="stylesheet" href="style.css"><script src="common.js"></script></head>
<body>
<h1>Create account</h1>
<form id="signup" data-record>
  <input id="username" name="email" type="email" autocomplete="email" placeholder="Email">
  <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Password">
  <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Repeat password">
  <button type="submit">Create account</button>
</form>
<pre id="result"></pre>
</body>
</html>
